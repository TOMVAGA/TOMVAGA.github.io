<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AREA CALCULATION</title>
</head>
<body style="background-color: bisque;">
    <h1 style="text-align: center;">CALCOLO AREA RETTANGOLO</h1>
    <p>Inserisci la base</p>
    <input type="number" step="0.1" id="base">
    <p>Inserisci l'altezza</p>
    <input type="number" step="0.1" id="altezza">
    <button onclick="calcolo()"> Calcola</button>
    <p id="result"></p>

    <script>
        let calcola,base,altezza

        function calcolo(){
            base = document.getElementById("base").value;
            if(base<=0)
                alert("ERRORE")
            altezza = document.getElementById("altezza").value;
            if(altezza==0)
                alert("ERRORE")

            let calcola=base*altezza;
            document.getElementById("result").innerHTML = "L'area del rettangolo e': " + calcola.toFixed("2") + " cm2";
        }
    </script>

</body>
</html>
